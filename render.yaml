services:
  # =========================================================
  # Backend API Service (Node.js / Express / Prisma)
  # Free tier web service connected to existing Supabase PostgreSQL
  # =========================================================
  - type: web
    name: hris-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: documents
      - key: FRONTEND_URL
        sync: false

  # =========================================================
  # Frontend Static Application (React 19 / Vite SPA)
  # Free global edge static site with client-side SPA routing
  # =========================================================
  - type: web
    name: hris-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: hris-backend
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
